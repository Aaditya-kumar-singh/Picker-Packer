name: Picker-Packer Android APK Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: picker-packer-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate Expo config
        run: npx expo config --type public --json > /tmp/expo-config.json

  build-and-release:
    name: Build APK with EAS and publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Add the EXPO_TOKEN repository Actions secret. The EAS project already manages the Android signing credentials."
            exit 1
          fi
          npx eas-cli@24.14.0 whoami --non-interactive

      - name: Build signed APK using the existing EAS preview profile
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: https://test.yourbuildmart.com/api/
        run: |
          set -euo pipefail
          npx eas-cli@24.14.0 build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --message "GitHub release for ${GITHUB_SHA}"

      - name: Find the completed EAS build for this commit
        id: eas-build
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli@24.14.0 build:list \
            --platform android \
            --status finished \
            --git-commit-hash "$GITHUB_SHA" \
            --build-profile preview \
            --limit 10 \
            --json \
            > "$RUNNER_TEMP/eas-builds.json"

          BUILD_ID="$(node -e '
            const fs = require("node:fs");
            const builds = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const build = builds.find((entry) =>
              entry.id &&
              String(entry.status).toLowerCase() === "finished" &&
              entry.buildProfile === "preview"
            );
            if (!build) {
              console.error("No finished Android preview build was found for this Git commit.");
              process.exit(1);
            }
            process.stdout.write(build.id);
          ' "$RUNNER_TEMP/eas-builds.json")"

          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Completed EAS build: $BUILD_ID"

      - name: Download APK from EAS
        id: apk
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ steps.eas-build.outputs.id }}
        run: |
          set -euo pipefail
          npx eas-cli@24.14.0 build:download \
            --build-id "$EAS_BUILD_ID" \
            --json \
            --non-interactive \
            > "$RUNNER_TEMP/eas-download.json"

          SOURCE_APK="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!result.path) {
              console.error("EAS did not return a downloaded APK path.");
              process.exit(1);
            }
            process.stdout.write(result.path);
          ' "$RUNNER_TEMP/eas-download.json")"

          test -s "$SOURCE_APK"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          APK_NAME="YBM-Picker-Packer-${SHORT_SHA}-android.apk"
          cp "$SOURCE_APK" "$RUNNER_TEMP/$APK_NAME"
          echo "path=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/$APK_NAME" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="android-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          gh release create "$TAG" "$APK_PATH#$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YBM Picker-Packer Android ${SHORT_SHA}" \
            --notes "Automated Android APK release using the configured EAS preview build profile.

          Source commit: ${GITHUB_SHA}
          Build profile: preview
          API base URL: https://test.yourbuildmart.com/api/
          EAS build ID: ${{ steps.eas-build.outputs.id }}
          APK SHA-256: ${APK_SHA256}

          This is a prerelease build for testing the test backend." \
            --prerelease \
            --latest=false
