name: Picker-Packer CI

on:
  push:
    branches: [master, aadi]
  pull_request:
    branches: [master, aadi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Picker-Packer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

