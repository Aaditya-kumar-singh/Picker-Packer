name: Picker-Packer CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Picker-Packer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

  android-build:
    name: Compile Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Reclaim runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # These hosted-runner toolchains and system images are not used by this
          # React Native Android debug build. Keep Android platform tools and NDKs.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator
          docker system prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android debug APK
        working-directory: frontend/android
        # CI needs installable phone APKs. Omitting x86/x86_64 cuts native CMake
        # outputs and reduces runner storage pressure without changing app code.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
