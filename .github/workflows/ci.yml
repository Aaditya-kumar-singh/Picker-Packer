name: Picker-Packer CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Picker-Packer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate lockfile for declared Expo SDK versions
        run: npm install --package-lock-only --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/expo-config.json

      - name: Persist regenerated dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ..
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frontend/package-lock.json; then
            git add frontend/package-lock.json
            git commit -m "chore: sync Expo SDK 57 lockfile [skip ci]"
            git push origin HEAD:master
          else
            echo "package-lock.json is already synchronized."
          fi
